name: Ephemeral dust persistence validation
on:
  push:
    branches: [ci-438-persistence]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 97e278ecf9d939cbd899ce9ce22b582cb4f736a3
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libevent-dev libboost-dev libsqlite3-dev ccache
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/ccache
          key: policy-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: policy-ccache-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DWITH_BDB=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j 4
      - name: Policy unit tests
        run: ctest --test-dir build --output-on-failure -j 4 -R 'mempool|policy|miner|transaction|rbf|validation|args|rpc.*mempool'
      - name: Functional policy tests
        run: python3 build/test/functional/test_runner.py --jobs=4 --tmpdirprefix=/tmp/policy-tests mempool_subdust_persist.py mempool_persist.py mempool_unbroadcast.py mempool_subdust_fee_penalty.py mempool_ephemeral_dust.py mempool_truc.py feature_rbf.py wallet_anchor.py
      - name: Confirm regression detects old persistence bug
        run: |
          git show HEAD:src/node/mempool_persist.cpp > /tmp/fixed-persist.cpp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/node/mempool_persist.cpp')
          s=p.read_text()
          s=s.replace('file << int64_t{delta == mapDeltas.end() ? 0 : delta->second};', 'file << int64_t{i.nFeeDelta};')
          s=s.replace('            const auto delta = mapDeltas.find(i.tx->GetHash());\n', '')
          p.write_text(s)
          PY
          cmake --build build -j 4
          python3 - <<'PY'
          import subprocess
          r=subprocess.run(['python3','build/test/functional/mempool_subdust_persist.py','--tmpdir=/tmp/persistence-control'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(r.stdout)
          assert r.returncode != 0, 'Regression unexpectedly passed with old persistence code'
          assert 'fees["modified"] - fees["base"]' in r.stdout, 'Unexpected failure instead of penalty accumulation'
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-test-logs
          path: |
            /tmp/policy-tests
            /tmp/persistence-control
            build/Testing/Temporary
