name: TRUC priority-space validation
on:
  push:
    branches: [ci-policy-defaults]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 58313216fd8172324e3ef37039cefa08b63bf0e9
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libevent-dev libboost-dev libsqlite3-dev ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: policy-ccache-${{ github.run_id }}
          restore-keys: policy-ccache-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DWITH_BDB=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j 4
      - name: Policy unit tests
        run: ctest --test-dir build --output-on-failure -j 4 -R 'mempool|policy|miner|transaction|rbf|validation|args|rpc.*mempool'
      - name: Functional policy tests
        run: python3 build/test/functional/test_runner.py --jobs=4 --tmpdirprefix=/tmp/policy-tests mempool_subdust_fee_penalty.py mempool_truc.py mempool_ephemeral_dust.py feature_rbf.py wallet_anchor.py mining_ephemeral_priority.py mining_coin_age_priority.py mining_prioritisetransaction.py
      - name: Test combined with ephemeral fee fix
        run: |
          git fetch origin e155555218104959bb4172707b02ce2fd2413489 --depth=2
          git diff e155555218104959bb4172707b02ce2fd2413489^ e155555218104959bb4172707b02ce2fd2413489 -- src/validation.cpp | git apply
          cmake --build build -j 4
          python3 build/test/functional/mining_ephemeral_priority.py --test-subdust-penalty --tmpdir=/tmp/priority-combined
      - name: Verify regression fails without priority fix
        run: |
          git fetch origin 05893c31ae8bdf7e341864bb5fa8594a005f1086 --depth=1
          git restore --source=05893c31ae8bdf7e341864bb5fa8594a005f1086 -- src/policy/coin_age_priority.cpp
          cmake --build build -j 4
          python3 - <<'PY'
          import subprocess
          r = subprocess.run(['python3', 'build/test/functional/mining_ephemeral_priority.py', '--test-subdust-penalty', '--tmpdir=/tmp/priority-control'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(r.stdout)
          assert r.returncode != 0, 'Regression unexpectedly passed without the fix'
          assert 'assert parent.hash not in self.template_txids()' in r.stdout, 'Unexpected failure instead of unpaired parent selection'
          PY
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-test-logs
          path: |
            /tmp/policy-tests
            /tmp/priority-combined
            /tmp/priority-control
            build/Testing/Temporary
