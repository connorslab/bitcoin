name: Priority fee floor rebased validation
on:
  push:
    branches: [ci-policy-defaults]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c9a6b466ec4fdf2651461a0b822bbd2c4bb76093
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libevent-dev libboost-dev libsqlite3-dev ccache
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/ccache
          key: policy-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: policy-ccache-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DWITH_BDB=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j 4
      - name: Policy unit tests
        run: ctest --test-dir build --output-on-failure -j 4 -R 'mempool|policy|miner|transaction|rbf|validation|args|rpc.*mempool'
      - name: Functional policy tests
        run: python3 build/test/functional/test_runner.py --jobs=4 --tmpdirprefix=/tmp/policy-tests mining_priority_fee.py mining_coin_age_priority.py mining_prioritisetransaction.py mining_basic.py mempool_ephemeral_dust.py mempool_truc.py feature_rbf.py wallet_anchor.py
      - name: Verify regression fails without fee-floor enforcement
        run: |
          git fetch origin 1c3e5c6e8e73866348702a20d047b2fa105a07cc --depth=1
          git restore --source=1c3e5c6e8e73866348702a20d047b2fa105a07cc -- src/policy/coin_age_priority.cpp
          cmake --build build -j 4
          python3 - <<'PY'
          import subprocess
          r = subprocess.run(['python3', 'build/test/functional/mining_priority_fee.py', '--tmpdir=/tmp/priority-control'], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(r.stdout)
          assert r.returncode != 0, 'Regression unexpectedly passed without fee-floor enforcement'
          assert 'Priority selection bypassed the mining fee floor' in r.stdout, 'Unexpected failure instead of fee-floor bypass'
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-test-logs
          path: |
            /tmp/policy-tests
            /tmp/priority-control
            build/Testing/Temporary
