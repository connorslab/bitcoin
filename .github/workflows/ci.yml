name: TRUC default validation
on:
  push:
    branches: [ci-policy-defaults]
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0f7236571c2cccf7309a29b23a805e2c5d86c551
      - name: Record tested source
        run: git rev-parse HEAD
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libevent-dev libboost-dev libsqlite3-dev ccache
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: ~/.cache/ccache
          key: policy-ccache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: policy-ccache-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DWITH_BDB=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build -j 4
      - name: Policy unit tests
        run: ctest --test-dir build --output-on-failure -j 4 -R 'mempool|policy|miner|transaction|rbf|validation|args|rpc.*mempool'
      - name: Functional policy tests
        run: python3 build/test/functional/test_runner.py --jobs=4 --tmpdirprefix=/tmp/policy-tests mempool_subdust_fee_penalty.py mempool_truc.py mempool_ephemeral_dust.py feature_rbf.py wallet_anchor.py mining_coin_age_priority.py mining_prioritisetransaction.py
      - name: Test combined with current PR 438
        run: |
          git fetch origin e155555218104959bb4172707b02ce2fd2413489 --depth=2
          git diff e155555218104959bb4172707b02ce2fd2413489^ e155555218104959bb4172707b02ce2fd2413489 -- src/validation.cpp test/functional/mempool_ephemeral_dust.py | git apply
          cmake --build build -j 4
          python3 build/test/functional/mempool_truc.py --tmpdir=/tmp/truc-combined
          python3 build/test/functional/mempool_ephemeral_dust.py --tmpdir=/tmp/ephemeral-combined
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-test-logs
          path: |
            /tmp/policy-tests
            /tmp/truc-combined
            /tmp/ephemeral-combined
            /tmp/priority-control
            build/Testing/Temporary
